name: Publish Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить номер версии
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Тег должен иметь формат vMAJOR.MINOR.PATCH, например v1.2.3" >&2
            exit 1
          fi
          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo "Компонент версии превышает допустимый диапазон" >&2
            exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
      - name: Подготовить ключ подписи
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.MERCHSELLER_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.MERCHSELLER_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.MERCHSELLER_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.MERCHSELLER_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Добавьте четыре секрета подписи из раздела выпуска релизов README.md" >&2
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/merchseller-release.jks"
      - name: Собрать подписанный APK
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreleaseVersion=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/merchseller-release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.MERCHSELLER_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.MERCHSELLER_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.MERCHSELLER_SIGNING_KEY_PASSWORD }}
      - name: Подготовить APK для публикации
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "MerchSeller-${GITHUB_REF_NAME}.apk"
      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MerchSeller ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: MerchSeller-${{ github.ref_name }}.apk
          make_latest: true
