name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
      - name: Установить JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Собрать отладочную версию
        run: ./gradlew assembleDebug --no-daemon
